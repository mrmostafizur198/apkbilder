<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>পুশ ডেমো — অ্যাডমিন</title>
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- লগইন -->
<section id="login" class="auth">
  <div class="box">
    <h1>🛠️ অ্যাডমিন লগইন</h1>
    <p class="sub">শুধু ডাটাবেসে নিবন্ধিত অ্যাডমিন ঢুকতে পারবেন</p>
    <label class="fld"><input id="l-email" type="email" placeholder="ইমেইল" autocomplete="username"></label>
    <label class="fld"><input id="l-pass" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"></label>
    <button class="btn" id="l-btn" data-act="login">লগইন করুন</button>
    <p class="err" id="l-err"></p>
    <button type="button" id="l-uid" class="uid" data-act="copyUid" hidden></button>
    <p class="hint" id="l-hint" hidden>এই UID টি Firebase Console → Realtime Database → <b>admins</b> এর নিচে বসান: নাম = UID, মান = <b>true</b>। তারপর আবার লগইন করুন।</p>
  </div>
</section>

<!-- মূল প্যানেল -->
<main id="main" class="wrap" hidden>
  <div class="top">
    <div class="brand">🛠️ পুশ ডেমো<small>অ্যাডমিন প্যানেল</small></div>
    <button class="ic" data-act="logout" aria-label="লগআউট">⎋</button>
  </div>

  <div class="card">
    <h3>পুশ সার্ভার</h3>
    <div class="row"><span>লিংক</span><b id="srv-url" style="font-size:11px;word-break:break-all;text-align:right"></b></div>
    <div class="row"><span>অবস্থা</span><b class="pill wait" id="srv-st">পরীক্ষা হয়নি</b></div>
    <button class="btn alt" data-act="ping">সার্ভার পরীক্ষা করুন</button>
  </div>

  <div class="card">
    <h3>বার্তা পাঠান</h3>
    <label class="lbl">কাকে পাঠাবেন</label>
    <label class="fld"><select id="c-to"><option value="all">📢 সব ইউজার</option></select></label>
    <label class="lbl">ধরন</label>
    <label class="fld"><select id="c-type"><option value="info">🔔 সাধারণ</option><option value="success">✅ সফলতা</option><option value="error">❌ সতর্কতা / বাতিল</option></select></label>
    <label class="fld"><input id="c-title" type="text" placeholder="শিরোনাম" maxlength="80"></label>
    <label class="fld"><textarea id="c-body" rows="3" placeholder="বার্তা লিখুন" maxlength="300"></textarea></label>
    <button class="btn" id="c-btn" data-act="send">পাঠান</button>
    <p class="err" id="c-err"></p>
    <div id="results" hidden>
      <div class="hint" id="r-sum" style="margin:12px 0 4px;font-weight:600;color:var(--text)"></div>
      <div id="r-list"></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="margin:0">ইউজার <span id="u-count" class="hint"></span></h3></div>
    <label class="fld"><input id="u-search" type="search" placeholder="নাম বা ইমেইল খুঁজুন"></label>
    <div id="u-list"></div>
  </div>
</main>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
